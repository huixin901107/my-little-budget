<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Little Budget</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5ef;color:#604c42;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:20px 16px 100px}h1{font-size:25px;margin:8px 0}h2{font-size:19px}small{color:#846d60}section{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #62452b0a}input,select,button{font:inherit;border:1px solid #e2d5ca;border-radius:10px;padding:10px;background:#fff;color:inherit;max-width:100%}input,select{width:100%;margin:5px 0 10px}button{background:#a9826d;color:white;cursor:pointer;margin:3px 0}button.alt{background:#f1e5db;color:#604c42}nav{position:fixed;bottom:0;background:#fff;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;padding:8px 4px env(safe-area-inset-bottom);box-shadow:0 -2px 12px #0001}nav button{background:white;color:#795b48;border:0;font-size:13px;padding:10px 9px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee4dc}.hero{background:#eedfd1}.big{font-size:30px;font-weight:700}.bad{color:#a84343}progress{width:100%;accent-color:#a9826d}label{font-size:14px}details{padding:8px 0;border-bottom:1px solid #eee4dc}summary{cursor:pointer}p{line-height:1.55}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #795747}nav button{flex:1;max-width:130px;min-height:48px}progress{accent-color:#a98c76} [hidden]{display:none!important}</style><main><small>♡ MY LITTLE BUDGET</small><h1>柔軟式記帳</h1><small>慢慢接近理想的自己</small><div id="cloudPanel"></div><section id="cloudBar" hidden><small id="cloudStatus" role="status"></small><div id="cloudButtons"><button class="alt" onclick="leaveBook()">切換／登出</button> <button class="alt" onclick="cloudSave()">重試同步</button> <button class="alt" onclick="backup()">備份</button></div></section><div id="app" hidden></div></main><nav id="nav" hidden></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script>
const C={'固定開支':['貸款','訂閱費','其他固定開支'],'必要開支':['飲食','交通','電話費','生活消耗品'],'變動開支':['衣物','教育','玩樂','醫療','美容','按摩','洗頭','購物','其他消費']};const today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};let month=today().slice(0,7),page='首頁';let base={accounts:[{id:'cash',name:'現金',balance:0}],records:[],debts:[],budgets:{},loan:{total:0,paid:0,amount:0,months:[]}};let s;try{s=JSON.parse(localStorage.getItem('littlebudget-v1'))||base}catch(e){s=base}s.goals??=[];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>'NT$ '+Number(x||0).toLocaleString('zh-TW'),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),num=x=>Number($(x).value),val=x=>$(x).value;function save(){if(mode==='cloud'){render();cloudSave();return}if(mode!=='guest')return;guest=JSON.parse(JSON.stringify(s));try{localStorage.setItem('littlebudget-v1',JSON.stringify(s))}catch(e){alert('無法儲存，請立即匯出備份')}render()}const reserved=()=>s.goals.reduce((a,g)=>a+g.saved,0), available=()=>total()-owed()-reserved(), total=()=>s.accounts.reduce((a,b)=>a+b.balance,0),owed=()=>s.debts.filter(d=>d.kind==='in').reduce((a,b)=>a+b.left,0),recv=()=>s.debts.filter(d=>d.kind==='out').reduce((a,b)=>a+b.left,0),acc=i=>s.accounts.find(a=>a.id===i),opts=()=>s.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} · ${money(a.balance)}</option>`).join(''),cats=()=>Object.keys(C).map(c=>`<option>${c}</option>`).join(''),budget=()=>s.budgets[month]||s.budgets[Object.keys(s.budgets).filter(m=>m<month).sort().pop()]||{income:0,'固定開支':0,'必要開支':0,'變動開支':0,saving:0,invest:0},used=(c,t)=>s.records.filter(r=>r.date.startsWith(month)&&r.type==='expense'&&r.cat===c&&(!t||r.tag===t)).reduce((a,b)=>a+b.amount,0);function go(p){page=p;render()}function line(a,b){return `<div class="line"><span>${a}</span><strong>${b}</strong></div>`}function addRecord(r){s.records.unshift({id:id(),...r})}function change(i,n){acc(i).balance+=n}function amountOk(n){return Number.isFinite(n)&&n>0}function render(){let b=budget(),h=`<div class="line"><small>♡ 慢慢接近理想的自己</small><button class="alt" onclick="go('設定')">設定</button></div><label>月份 <input type="month" value="${month}" onchange="month=this.value;render()"></label>`;if(page==='首頁'){h+=`<section class="hero"><small>未指定用途資金（扣除待還款與已存夢想基金）</small><div class="big">${money(available())}</div>${line('現金與銀行',money(total()))}${line('已存夢想基金',money(reserved()))}${line('本月安心可花（變動開支上限）',money(safeSpend()))}${line('待收款',money(recv()))}${line('負債（朋友代墊）',money(owed()))}</section><section><h2>本月預算</h2>${Object.keys(C).map(c=>line(c,money(b[c]-used(c)))+`<progress max="${Math.max(1,b[c])}" value="${used(c)}"></progress>`).join('')}</section><section><h2>待辦事項</h2>${s.loan.total>s.loan.paid&&!s.loan.months.includes(today().slice(0,7))?`<p>每月 5 日確認貸款扣款 ${Number(today().slice(-2))>=5?'（本月待確認）':''}</p><button onclick="go('貸款')">查看貸款</button>`:'<p>目前無貸款提醒</p>'}${s.debts.filter(d=>d.left>0).map(d=>line(esc(d.person)+' · '+(d.kind==='in'?'待還':'待收'),money(d.left))).join('')}<button onclick="go('借貸')">管理借貸</button>${s.goals.map(g=>line(esc(g.name)+' 本月尚需存',money(Math.max(0,g.monthly-goalMonth(g))))).join('')}</section><section><h2>夢想正在發芽</h2>${s.goals.map(g=>line(esc(g.name),money(g.saved)+' / '+money(g.target))+`<progress max="${g.target}" value="${g.saved}"></progress>`).join('')||'建立第一個夢想，慢慢累積。'}<button class="alt" onclick="go('夢想')">查看夢想</button></section>`}if(page==='預算'){h+=`<section><h2>每月預算分配</h2>${[['income','收入'],...Object.keys(C).map(c=>[c,c]),['saving','每月額外儲蓄（不含夢想）'],['invest','投資']].map(([k,n],i)=>`<label>${n}<input type="number" min="0" id="b${i}" value="${b[k]}"></label>`).join('')}<p>目前未分配：${money(b.income-Object.keys(C).reduce((a,c)=>a+b[c],0)-b.saving-b.invest-s.goals.reduce((a,g)=>a+g.monthly,0))}</p>${line('夢想每月存款目標',money(s.goals.reduce((a,g)=>a+g.monthly,0)))}<button onclick="saveBudget()">儲存預算</button><small>新月份沿用最近設定；請在新月份確認儲存。</small></section>`}if(page==='記帳'){h+=`<section><h2>新增記帳</h2><label>日期<input id="date" type="date" value="${month===today().slice(0,7)?today():month+'-01'}" onchange="rem()"></label><label>類型<select id="type" onchange="refreshTags()"><option value="expense">消費</option><option value="income">收入</option><option value="invest">投資</option></select></label><div id="classbox"><label>分類<select id="cat" onchange="refreshTags()">${cats()}</select></label><label>標籤<select id="tag"></select></label></div><label>金額<input id="amount" type="number" min="1" oninput="rem()"></label><div id="rem"></div><label>帳戶<select id="account">${opts()}</select></label><label>備註<input id="note" placeholder="實際品名（選填）"></label><button onclick="record()">儲存記帳</button></section><section><h2>本月紀錄</h2>${s.records.filter(r=>r.date.startsWith(month)).map(r=>`<details><summary>${esc(r.cat||r.type)}${r.tag?' / '+esc(r.tag):''} · ${money(r.amount)}</summary><p>${esc(r.date)} · ${esc(acc(r.account)?.name||'')}<br>${esc(r.note||'無備註')}</p>${r.manual?`<button class="alt" onclick="removeRecord('${r.id}')">刪除並沖回餘額</button>`:''}</details>`).join('')||'尚無紀錄'}</section>`}if(page==='資產'){h+=`<section><button class="alt" onclick="go('借貸')">借貸與代墊</button> <button class="alt" onclick="go('貸款')">貸款進度</button> <button class="alt" onclick="go('統計')">月度回顧</button></section><section class="hero"><small>帳戶總額</small><div class="big">${money(total())}</div></section><section>${s.accounts.map(a=>line(esc(a.name),money(a.balance)+` <button class="alt" onclick="adjust('${a.id}')">校正</button>`)).join('')}<label>帳戶名稱<input id="aname" placeholder="銀行名稱"></label><label>初始餘額<input id="abal" type="number" value="0"></label><button onclick="newAccount()">新增帳戶</button></section><section><h2>帳戶轉帳</h2><label>轉出<select id="from">${opts()}</select></label><label>轉入<select id="to">${opts()}</select></label><label>金額<input id="transfer" type="number"></label><button onclick="transfer()">確認轉帳</button></section>`}if(page==='借貸'){h+=`<section>${line('待收款',money(recv()))}${line('待還款',money(owed()))}<h2>新增借貸</h2><select id="kind" onchange="debtFields()"><option value="out">借出／我幫朋友墊錢</option><option value="in">借入／朋友幫我墊錢</option><option value="cashin">實際收到借款</option></select><label>姓名<input id="person"></label><label>金額<input id="damt" type="number"></label><div id="da"><label>帳戶<select id="dacc">${opts()}</select></label></div><div id="dc" hidden><label>個人消費分類<select id="dcat" onchange="debtFields()">${cats()}</select></label><select id="dtag"></select></div><label>備註<input id="dmemo"></label><button onclick="newDebt()">新增</button></section><section><h2>未結清事項</h2>${s.debts.filter(d=>d.left>0).map(d=>`<details><summary>${esc(d.person)} · ${d.kind==='out'?'待收':'待還'} ${money(d.left)}</summary><p>${esc(d.memo)}</p><label>結清帳戶<select id="a${d.id}">${opts()}</select></label><label>本次金額<input type="number" id="n${d.id}" value="${d.left}"></label><button onclick="settle('${d.id}')">確認${d.kind==='out'?'收款':'還款'}</button></details>`).join('')||'沒有待辦'}</section><section><h2>結清歷史</h2>${s.debts.filter(d=>!d.left).map(d=>line(esc(d.person)+' · '+(d.kind==='out'?'已收':'已還'),money(d.amount))).join('')||'尚無紀錄'}</section>`}if(page==='貸款'){let l=s.loan;h+=`<section><h2>貸款進度</h2><label>總期數<input id="lt" type="number" value="${l.total}"></label><label>已還期數<input id="lp" type="number" value="${l.paid}"></label><label>每期金額<input id="la" type="number" value="${l.amount}"></label><button onclick="loanSave()">更新設定</button><progress max="${Math.max(1,l.total)}" value="${l.paid}"></progress>${line('剩餘期數',Math.max(0,l.total-l.paid)+' 期')}${line('預計剩餘應繳',money((l.total-l.paid)*l.amount))}<p>每月 5 日開啟 App 時提醒確認扣款。無背景推播。</p><label>扣款帳戶<select id="lacc">${opts()}</select></label><button onclick="loanPay()" ${l.total<=l.paid||l.months.includes(month)?'disabled':''}>確認 ${month} 已還款</button></section>`}if(page==='統計'){h+=`<section><h2>每月消費統計</h2>${Object.keys(C).map(c=>`<h3>${c} · ${money(used(c))}</h3>${C[c].map(t=>line(t,money(used(c,t)))).join('')}`).join('')}</section><section>${['income','invest','saving'].map((t,i)=>line(['實際收入','投資投入','儲蓄轉移'][i],money(s.records.filter(r=>r.type===t&&r.date.startsWith(month)).reduce((a,r)=>a+r.amount,0)))).join('')}</section>`}if(page==='夢想'){h+=dreamPage()}if(page==='設定'){h+=`<section><h2>資料備份</h2><p>本機模式與雲端模式分開儲存。請定期匯出備份；匯入會覆蓋目前帳本。</p><button onclick="backup()">匯出 JSON 備份</button><label>匯入備份（覆蓋目前資料）<input type="file" accept=".json" onchange="restore(this)"></label></section>`}$('app').innerHTML=h;$('nav').innerHTML=['首頁','預算','記帳','資產','夢想'].map(p=>`<button onclick="go('${p}')" style="${p===page?'font-weight:bold;background:#f0e3d8':''}">${p}</button>`).join('');if(page==='記帳')refreshTags();if(page==='借貸')debtFields()}
function saveBudget(){let keys=['income',...Object.keys(C),'saving','invest'];let v=keys.map((k,i)=>num('b'+i));if(v.some(n=>!Number.isFinite(n)||n<0))return alert('請輸入有效金額');s.budgets[month]=Object.fromEntries(keys.map((k,i)=>[k,v[i]]));save()}function refreshTags(){let e=val('type')==='expense';$('classbox').hidden=!e;$('tag').innerHTML=C[val('cat')].map(t=>`<option>${t}</option>`).join('');rem()}function rem(){let m=month;month=(val('date')||today()).slice(0,7);let left=budget()[val('cat')]-used(val('cat'))-(num('amount')||0);$('rem').textContent=val('type')==='expense'?'該月分類記帳後剩餘 '+money(left)+(left<0?' · 已超出預算，可調整分配':''):'';month=m}function record(){let n=num('amount'),a=val('account'),t=val('type'),d=val('date');if(!amountOk(n)||!d)return alert('請確認日期及金額');let delta=t==='income'?n:t==='saving'?0:-n;if(delta<0&&acc(a).balance+delta<accountReserved(a))return alert('帳戶餘額不足，請先校正');addRecord({date:d,type:t,cat:t==='expense'?val('cat'):['income','invest','saving'].includes(t)?{income:'收入',invest:'投資',saving:'儲蓄紀錄'}[t]:t,tag:t==='expense'?val('tag'):'',amount:n,account:a,note:val('note'),manual:true,delta});change(a,delta);month=d.slice(0,7);save()}function removeRecord(i){let r=s.records.find(r=>r.id===i);if(!r?.manual||acc(r.account).balance-r.delta<accountReserved(r.account)||!confirm('刪除此筆並沖回帳戶？'))return;change(r.account,-r.delta);s.records=s.records.filter(x=>x.id!==i);save()}function adjust(i){let v=prompt('輸入實際帳戶餘額',acc(i).balance);if(v!==null&&v.trim()&&Number.isFinite(+v)&&+v>=accountReserved(i)){acc(i).balance=+v;save()}}function newAccount(){let n=val('aname').trim(),b=num('abal');if(!n||!Number.isFinite(b)||b<0)return alert('請確認名稱及金額');s.accounts.push({id:id(),name:n,balance:b});save()}function transfer(){let a=val('from'),b=val('to'),n=num('transfer');if(a===b||!amountOk(n)||acc(a).balance-accountReserved(a)<n)return alert('請確認帳戶及金額');change(a,-n);change(b,n);addRecord({date:today(),type:'transfer',cat:'帳戶轉帳',amount:n,account:a,note:'轉入 '+acc(b).name});save()}function debtFields(){let k=val('kind');$('da').hidden=k==='in';$('dc').hidden=k!=='in';$('dtag').innerHTML=C[val('dcat')].map(t=>`<option>${t}</option>`).join('')}function newDebt(){let k=val('kind'),n=num('damt'),p=val('person').trim(),a=val('dacc');if(!p||!amountOk(n)||k==='out'&&acc(a).balance-accountReserved(a)<n)return alert('請確認姓名、金額與餘額');if(k==='out')change(a,-n);if(k==='cashin')change(a,n);let d={id:id(),kind:k==='out'?'out':'in',person:p,amount:n,left:n,memo:val('dmemo'),date:today(),payments:[]};s.debts.push(d);if(k==='in')addRecord({date:today(),type:'expense',cat:val('dcat'),tag:val('dtag'),amount:n,note:p+' 代墊 '+d.memo});save()}function settle(i){let d=s.debts.find(x=>x.id===i),n=num('n'+i),a=val('a'+i);if(!amountOk(n)||n>d.left||d.kind==='in'&&acc(a).balance-accountReserved(a)<n)return alert('請確認結清金額與餘額');change(a,d.kind==='out'?n:-n);d.left-=n;d.payments.push({date:today(),amount:n,account:a});save()}function loanSave(){let t=num('lt'),p=num('lp'),a=num('la');if(!Number.isInteger(t)||!Number.isInteger(p)||p<0||t<p||!Number.isFinite(a)||a<0)return alert('請確認期數');Object.assign(s.loan,{total:t,paid:p,amount:a});save()}function loanPay(){let l=s.loan,a=val('lacc');if(l.paid>=l.total||l.months.includes(month)||!amountOk(l.amount)||acc(a).balance-accountReserved(a)<l.amount)return alert('請確認期數、金額與帳戶餘額');if(!confirm('確認本月已扣款？'))return;change(a,-l.amount);l.paid++;l.months.push(month);addRecord({date:month+'-05',type:'expense',cat:'固定開支',tag:'貸款',amount:l.amount,account:a,note:'確認貸款還款'});save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='budget-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.accounts)||!Array.isArray(x.records)||!Array.isArray(x.debts)||!x.budgets||!x.loan)throw Error();if(confirm('覆蓋目前資料？')){x.goals??=[];s=x;save()}}catch(e){alert('備份格式錯誤')}}function goalMonth(g){return g.moves.filter(x=>x.date.startsWith(month)).reduce((a,x)=>a+x.amount,0)}
function safeSpend(){let b=budget();let fixed=Math.max(0,b['固定開支']-used('固定開支'));let loan=s.loan;let loanDue=loan.total>loan.paid&&!loan.months.includes(month)?loan.amount:0;let essential=Math.max(0,b['必要開支']-used('必要開支'));let future=s.goals.reduce((a,g)=>a+Math.max(0,g.monthly-goalMonth(g)),0);return Math.max(0,Math.min(b['變動開支']-used('變動開支'),available()-Math.max(fixed,loanDue)-essential-future-b.saving-Math.max(0,b.invest-s.records.filter(r=>r.type==='invest'&&r.date.startsWith(month)).reduce((a,r)=>a+r.amount,0))))}
function dreamPage(){return `<section class="hero"><small>夢想基金已預留（仍屬於銀行資產）</small><div class="big">${money(reserved())}</div><p>夢想基金為帳戶內的用途標記，不是額外收入或消費。</p></section>${s.goals.map(g=>`<section><h2>♡ ${esc(g.name)}</h2>${line('累積進度',money(g.saved)+' / '+money(g.target))}<progress max="${g.target}" value="${g.saved}"></progress>${line('達成率',Math.floor(g.saved/g.target*100)+'%')}${line('本月已存',money(goalMonth(g))+' / '+money(g.monthly))}${line('剩餘目標',money(Math.max(0,g.target-g.saved)))}${line('預計達成',esc(g.deadline||'未設定'))}<small>${esc(acc(g.account)?.name||'')}</small><label>本次金額<input type="number" min="1" id="g${g.id}"></label><button onclick="goalMove('${g.id}',1)">確認存入</button> <button class="alt" onclick="goalMove('${g.id}',-1)">解除預留</button><details><summary>存款歷史</summary>${g.moves.map(x=>line(esc(x.date),money(x.amount))).join('')||'尚無紀錄'}</details></section>`).join('')}<section><h2>建立夢想</h2><label>名稱<input id="gn" placeholder="例如：旅行基金"></label><label>目標金額<input type="number" id="gt" oninput="goalHint()"></label><label>希望達成日期（選填）<input type="date" id="gd" onchange="goalHint()"></label><p id="gh"></p><label>每月存款目標<input type="number" id="gm" value="0"></label><label>預留所在帳戶<select id="ga">${opts()}</select></label><label>目前已存（已包含於帳戶餘額）<input type="number" id="gs" value="0" oninput="goalHint()"></label><button onclick="newGoal()">建立夢想計畫</button></section>`}
function goalHint(){let d=val('gd'),n=num('gt')-num('gs');if(!d)return;let now=today();let m=Math.max(1,(+d.slice(0,4)-+now.slice(0,4))*12+(+d.slice(5,7)-+now.slice(5,7))+1);$('gh').textContent='建議每月存 '+money(Math.ceil(Math.max(0,n)/m))+'（含本月）';$('gm').value=Math.ceil(Math.max(0,n)/m)}
function accountReserved(a){return s.goals.filter(g=>g.account===a).reduce((n,g)=>n+g.saved,0)}
function newGoal(){let name=val('gn').trim(),target=num('gt'),saved=num('gs'),monthly=num('gm'),account=val('ga');if(!name||!amountOk(target)||!Number.isFinite(saved)||!Number.isFinite(monthly)||saved<0||saved>target||monthly<0||saved>acc(account).balance-accountReserved(account)||saved>Math.max(0,available()))return alert('請確認目標、金額及可預留餘額');s.goals.push({id:id(),name,target,saved,monthly,account,deadline:val('gd'),moves:[]});save()}
function goalMove(i,dir){let g=s.goals.find(x=>x.id===i),n=num('g'+i);if(!amountOk(n)||dir<0&&n>g.saved||dir>0&&(n>acc(g.account).balance-accountReserved(g.account)||n>available()||n>g.target-g.saved))return alert('請確認金額及可用餘額');g.saved+=n*dir;g.moves.unshift({date:today(),amount:n*dir});save()}

const cloud=window.supabase?.createClient('https://hicizybgqfyondqkxtxy.supabase.co','sb_publishable_PQzAjEcDfwLKtM18qKiUNA_Gptv_Slj');
let mode='locked',uid=null,revision=null,pending=false,busy=false,guest=JSON.parse(JSON.stringify(s));
const fresh=()=>({accounts:[{id:'cash',name:'現金',balance:0}],records:[],debts:[],budgets:{},loan:{total:0,paid:0,amount:0,months:[]},goals:[]});
function status(t){$('cloudStatus').textContent=t}
function controls(lock){$('app').inert=lock;$('nav').inert=lock;$('cloudButtons').inert=lock}
function loginScreen(msg=''){mode='locked';uid=null;revision=null;s=fresh();$('app').hidden=true;$('nav').hidden=true;$('cloudPanel').hidden=false;$('cloudBar').hidden=true;$('cloudPanel').innerHTML=`<section><h2>歡迎回到你的金錢小天地</h2><p id="authMsg" role="status"></p><label>電子郵件<input id="email" type="email" autocomplete="email"></label><label>密碼（至少12字元）<input id="pw" type="password" autocomplete="current-password"></label><button onclick="authAction('login')">登入我的帳本</button> <button class="alt" onclick="authAction('signup')">建立帳號</button> <button class="alt" onclick="authAction('reset')">忘記密碼</button><hr><button class="alt" onclick="guestMode()">先使用本機帳本</button></section>`;$('authMsg').textContent=msg;controls(false)}
function guestMode(){mode='guest';s=JSON.parse(JSON.stringify(guest));showBook();status('本機帳本 · 未同步')}
function showBook(){$('cloudPanel').hidden=true;$('cloudBar').hidden=false;$('app').hidden=false;$('nav').hidden=false;page='首頁';render()}
async function authAction(action){if(busy)return;let e=val('email').trim(),p=val('pw');if(!cloud)return $('authMsg').textContent='無法載入登入服務，請確認網路';if(!e||action!=='reset'&&!p)return $('authMsg').textContent='請填寫電子郵件及密碼';if(action==='signup'&&p.length<12)return $('authMsg').textContent='密碼至少12字元';busy=true;try{let result=action==='login'?await cloud.auth.signInWithPassword({email:e,password:p}):action==='signup'?await cloud.auth.signUp({email:e,password:p,options:{emailRedirectTo:SITE}}):await cloud.auth.resetPasswordForEmail(e,{redirectTo:SITE});if(result.error)throw result.error;if(result.data?.session)await openCloud(result.data.session);else $('authMsg').textContent=action==='reset'?'若帳號存在，請查看重設密碼郵件。':'請查看驗證郵件，驗證後再登入。'}catch(e){$('authMsg').textContent=e.message||'操作失敗'}finally{busy=false}}
async function openCloud(session){mode='locked';uid=session.user.id;$('cloudPanel').hidden=false;$('cloudPanel').textContent='正在讀取雲端帳本…';$('app').hidden=true;$('nav').hidden=true;try{let r=await cloud.from('budget_data').select('data,version').eq('user_id',uid).maybeSingle();if(r.error)throw r.error;revision=r.data?.version??null;s=r.data?.data??fresh();s.goals??=[];mode='cloud';pending=false;showBook();status('雲端帳本 · '+(session.user.email||'已登入'));if(revision===null)status('新雲端帳本 · 可在設定匯入本機備份')}catch(e){await cloud.auth.signOut();loginScreen('讀取失敗：'+e.message)}}
async function cloudSave(){if(busy||mode!=='cloud')return;busy=true;pending=true;controls(true);status('正在同步…');try{let row={data:JSON.parse(JSON.stringify(s)),updated_at:new Date().toISOString()};let q=revision===null?cloud.from('budget_data').insert({...row,user_id:uid,version:1}):cloud.from('budget_data').update({...row,version:Number(revision)+1}).eq('user_id',uid).eq('version',revision);let r=await q.select('version').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('其他裝置已更新帳本，請先匯出本次修改再重新登入');revision=r.data.version;pending=false;status('已同步至雲端')}catch(e){status('尚未同步：'+e.message+'。請匯出備份或重試。')}finally{busy=false;controls(false)}}
async function leaveBook(){if(busy)return;if(pending&&!confirm('有尚未同步的修改，請先匯出備份。確定離開？'))return;if(mode==='cloud'){let r=await cloud.auth.signOut();if(r.error)return status('登出失敗：'+r.error.message)}pending=false;loginScreen()}
function recovery(){mode='locked';$('app').hidden=true;$('nav').hidden=true;$('cloudBar').hidden=true;$('cloudPanel').hidden=false;$('cloudPanel').innerHTML='<section><h2>重設密碼</h2><label>新密碼（至少12字元）<input id="newpw" type="password" autocomplete="new-password"></label><button onclick="resetFinish()">儲存新密碼</button><p id="authMsg"></p></section>'}
async function resetFinish(){let p=val('newpw');if(p.length<12)return $('authMsg').textContent='密碼至少12字元';let r=await cloud.auth.updateUser({password:p});if(r.error)return $('authMsg').textContent=r.error.message;await cloud.auth.signOut();loginScreen('密碼已更新，請重新登入。')}
window.addEventListener('beforeunload',e=>{if(pending){e.preventDefault();e.returnValue=''}});
async function initCloud(){loginScreen();if(!cloud)return;let recovering=location.hash.includes('type=recovery');cloud.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')recovery()});let r=await cloud.auth.getSession();if(recovering){recovery();return}if(r.data?.session&&$('newpw')===null)await openCloud(r.data.session)}
